name: CI and internal deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[web,dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Tests
        run: python -m pytest
      - name: Validate Compose file
        env:
          SECURE_RAG_API_KEY: ci-placeholder-backend-key
          OPEN_WEBUI_SECRET_KEY: ci-placeholder-session-key
        run: docker compose -f deploy/docker-compose.yml config --quiet

  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_INTERNAL_DEPLOY == 'true'
    needs: test
    runs-on: [self-hosted, Windows, X64, universal-rag]
    environment: internal-production
    steps:
      - name: Fast-forward installed service
        shell: powershell
        run: |
          if (-not $env:UNIVERSAL_RAG_DEPLOY_ROOT) {
            throw "UNIVERSAL_RAG_DEPLOY_ROOT is not configured for the runner service."
          }
          & "$env:UNIVERSAL_RAG_DEPLOY_ROOT\scripts\deploy-host.ps1"
