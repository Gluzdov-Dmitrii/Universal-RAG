schema_version: 2

paths:
  # Override with SECURE_RAG_SOURCE_ROOT on each server. A Nextcloud Desktop
  # synchronized folder is the first supported company deployment profile.
  source_root: "C:/Data/Nextcloud"
  runtime_root: "runtime"

ingestion:
  supported_extensions:
    - ".txt"
    - ".md"
    - ".csv"
    - ".json"
    - ".xml"
    - ".htm"
    - ".html"
    - ".docx"
    - ".xlsx"
    - ".pptx"
    - ".pdf"
  chunk_chars: 450
  chunk_overlap_chars: 80
  min_chunk_chars: 80
  pdf_max_pages: 250
  max_file_mb: 200
  max_extracted_chars: 5000000
  persist_extracted_text_cache: false

embedding:
  model_id: "intfloat/multilingual-e5-small"
  revision: "614241f622f53c4eeff9890bdc4f31cfecc418b3"
  dimension: 384
  batch_size: 64
  device: "auto"
  query_prefix: "query: "
  passage_prefix: "passage: "

qdrant:
  mode: "server"
  collection_name: "universal_rag_e5_v1"
  url: "http://127.0.0.1:6333"
  timeout_seconds: 60
  write_max_attempts: 3
  retry_backoff_seconds: 0.25

retrieval:
  top_k: 12
  access_group: "employees"
  score_threshold: null
  hnsw_ef: 512
  exact_search: false
  iterative_enabled: true
  max_iterations: 3
  max_queries_per_iteration: 3
  max_contexts: 24
  rewrite_min_similarity: 0.55
  adjacent_chunk_radius: 1
  # Small chunks are search anchors only. The provider receives a whole source
  # document when it fits, otherwise a larger page/slide/sheet-aware parent.
  parent_context_enabled: true
  whole_document_max_chars: 80000
  logical_parent_max_chars: 30000
  total_context_max_chars: 180000

llm:
  agent_workspace_root: "C:/Services/Universal-RAG-Agent"
  instruction_files:
    - ".cursor/rules/rag-assistant.mdc"
    - ".cursor/skills/answering-with-secure-rag/SKILL.md"
  max_instruction_chars: 20000

sanitization:
  marker_pattern_version: 1
  fail_on_unknown_marker: true
  regex_enabled: true
  models:
    - name: "legal"
      model_id: "LLAIMlegal/ru-legal-ner"
      revision: "c0313a42ac147ccc38f5c3b0b3e77cab53208683"
      local_path: "runtime/cache/models/ner/legal-c0313a42"
      enabled: true
      threshold: 0.85
      device: "auto"
      priority: 100
      min_chars: 3
      allowed_labels:
        - "PER"
        - "ORG"
        - "ADDRESS"
        - "EMAIL"
        - "PHONE"
        - "INN"
        - "SNILS"
        - "PASSPORT"
        - "BANK_ACCOUNT"
        - "OGRN"
    - name: "collection3"
      model_id: "viktor-shcherb/sberbank-rubert-base-collection3"
      revision: "65ccbf8d2d25229c3858631bb24bb794c0c6907c"
      local_path: null
      enabled: true
      threshold: 0.90
      device: "auto"
      priority: 200
      min_chars: 3
      allowed_labels:
        - "PER"
        - "ORG"
        - "LOC"
    - name: "gliner"
      model_id: ""
      revision: ""
      local_path: null
      enabled: false
      threshold: 0.70
      device: "auto"
      priority: 50

bridge:
  max_output_chars: 200000
